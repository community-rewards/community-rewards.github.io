<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take Photo</title>
<style>
:root{--bg:#fafafa;--fg:#161616;--muted:#777;--line:#dcdcdc;--ok:#1a7f4b;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#f2f2f2;--muted:#9a9a9a;--line:#333;--ok:#4cc38a;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:360px;display:flex;flex-direction:column;gap:16px;align-items:stretch}
.frame{aspect-ratio:3/4;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#000;display:none}
.frame.on{display:block}
video,img{width:100%;height:100%;object-fit:cover;display:block}
button{font:inherit;font-size:16px;padding:14px;border-radius:6px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.row{display:flex;gap:8px}
.row button{flex:1}
#status{min-height:1.4em;font-size:14px;color:var(--muted);text-align:center;margin:0}
#status.ok{color:var(--ok)}
#status.err{color:var(--err)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div class="frame" id="frame"></div>
<button id="start">Take Photo</button>
<div class="row" id="capture" hidden>
<button class="ghost" id="cancel">Cancel</button>
<button id="snap">Capture</button>
</div>
<div class="row" id="review" hidden>
<button class="ghost" id="retake">Retake</button>
<button id="save">Save</button>
</div>
<p id="status" role="status"></p>
</main>
<script>
const UPLOAD_URL="https://photos.my9761313328.workers.dev/upload";
const frame=document.getElementById("frame");
const startBtn=document.getElementById("start");
const capture=document.getElementById("capture");
const review=document.getElementById("review");
const snapBtn=document.getElementById("snap");
const cancelBtn=document.getElementById("cancel");
const retakeBtn=document.getElementById("retake");
const saveBtn=document.getElementById("save");
const statusEl=document.getElementById("status");
let stream=null;
let blob=null;

function say(text,type){
statusEl.textContent=text||"";
statusEl.className=type||"";
}

function show(mode){
startBtn.hidden=mode!=="idle";
capture.hidden=mode!=="live";
review.hidden=mode!=="shot";
frame.classList.toggle("on",mode!=="idle");
}

function stopStream(){
if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
}

async function openCamera(){
say("");
try{
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
}catch(e){
say("Camera access nahi mila. Browser me permission allow karein.","err");
return;
}
const video=document.createElement("video");
video.autoplay=true;
video.playsInline=true;
video.muted=true;
video.srcObject=stream;
frame.replaceChildren(video);
show("live");
}

function takeShot(){
const video=frame.querySelector("video");
if(!video||!video.videoWidth)return;
const canvas=document.createElement("canvas");
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;
canvas.getContext("2d").drawImage(video,0,0);
canvas.toBlob(b=>{
blob=b;
stopStream();
const img=document.createElement("img");
img.alt="Captured photo";
img.src=URL.createObjectURL(b);
frame.replaceChildren(img);
show("shot");
},"image/jpeg",0.8);
}

async function upload(){
if(!blob)return;
saveBtn.disabled=true;
retakeBtn.disabled=true;
say("Saving...");
const data=new FormData();
data.append("photo",blob,"photo-"+Date.now()+".jpg");
try{
const res=await fetch(UPLOAD_URL,{method:"POST",body:data});
if(!res.ok)throw new Error(res.status);
say("Photo saved.","ok");
blob=null;
frame.replaceChildren();
show("idle");
}catch(e){
say("Save nahi hua. Dobara try karein.","err");
}
saveBtn.disabled=false;
retakeBtn.disabled=false;
}

startBtn.addEventListener("click",openCamera);
snapBtn.addEventListener("click",takeShot);
cancelBtn.addEventListener("click",()=>{stopStream();frame.replaceChildren();show("idle");say("")});
retakeBtn.addEventListener("click",()=>{blob=null;openCamera()});
saveBtn.addEventListener("click",upload);
</script>
</body>
</html>
