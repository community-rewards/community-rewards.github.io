<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto Camera – 10 Photos</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--surface:#fff;--text:#14161a;--muted:#5d6470;--accent:#2563eb;--overlay:rgba(10,12,16,.65)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--surface:#1a1d23;--text:#f2f4f8;--muted:#9aa3b2;--accent:#5b8cff;--overlay:rgba(0,0,0,.75)}}
:root[data-theme="dark"]{--bg:#0f1115;--surface:#1a1d23;--text:#f2f4f8;--muted:#9aa3b2;--accent:#5b8cff;--overlay:rgba(0,0,0,.75)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:16px}
.stage{position:relative;width:100%;max-width:480px;aspect-ratio:3/4;background:#000;border-radius:20px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.badge{position:absolute;top:12px;left:12px;background:var(--overlay);color:#fff;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .15s}
.flash.on{opacity:.8}
.bar{width:100%;max-width:480px;height:8px;background:var(--surface);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.status{color:var(--muted);font-size:15px;text-align:center;margin:0}
.modal{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.open{display:flex}
.card{background:var(--surface);color:var(--text);border-radius:20px;width:100%;max-width:560px;max-height:90%;display:flex;flex-direction:column;overflow:hidden}
.card h2{margin:0;padding:16px 20px;font-size:18px}
.grid{padding:0 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;overflow-y:auto}
.grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block;transform:scaleX(-1)}
.actions{display:flex;gap:8px;padding:12px 16px;border-top:1px solid rgba(128,128,128,.25)}
button{flex:1;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
button.alt{background:transparent;color:var(--text);border:1px solid rgba(128,128,128,.4)}
</style>
</head>
<body>
<div class="stage">
<video id="video" autoplay playsinline muted></video>
<div class="badge" id="badge">Camera khul raha hai…</div>
<div class="flash" id="flash"></div>
</div>
<div class="bar"><span id="progress"></span></div>
<p class="status" id="status">Camera ki permission allow kijiye.</p>

<div class="modal" id="modal">
<div class="card">
<h2>Aapki 10 photos</h2>
<div class="grid" id="grid"></div>
<div class="actions">
<button class="alt" id="retake">Dobara lo</button>
<button id="download">Download</button>
<button class="alt" id="close">Band karo</button>
</div>
</div>
</div>

<canvas id="canvas" hidden></canvas>

<script>
const TOTAL = 10;
const GAP_MS = 600;
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const badge = document.getElementById('badge');
const statusEl = document.getElementById('status');
const progress = document.getElementById('progress');
const flash = document.getElementById('flash');
const modal = document.getElementById('modal');
const grid = document.getElementById('grid');
let stream = null;
let photos = [];

const wait = ms => new Promise(r => setTimeout(r, ms));

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 1280 } },
      audio: false
    });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    await video.play();
    await wait(800);
    capture();
  } catch (e) {
    badge.textContent = 'Camera nahi khula';
    statusEl.textContent = 'Camera permission allow kijiye aur page reload kijiye.';
  }
}

async function capture() {
  photos = [];
  progress.style.width = '0';
  const w = video.videoWidth;
  const h = video.videoHeight;
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  statusEl.textContent = 'Photos click ho rahi hain…';
  for (let i = 1; i <= TOTAL; i++) {
    ctx.drawImage(video, 0, 0, w, h);
    photos.push(canvas.toDataURL('image/jpeg', 0.9));
    badge.textContent = i + ' / ' + TOTAL;
    progress.style.width = (i / TOTAL * 100) + '%';
    flash.classList.add('on');
    setTimeout(() => flash.classList.remove('on'), 120);
    if (i < TOTAL) await wait(GAP_MS);
  }
  statusEl.textContent = 'Ho gaya!';
  showPopup();
}

function showPopup() {
  grid.innerHTML = '';
  photos.forEach(src => {
    const img = document.createElement('img');
    img.src = src;
    grid.appendChild(img);
  });
  modal.classList.add('open');
}

function downloadAll() {
  photos.forEach((src, i) => {
    const a = document.createElement('a');
    a.href = src;
    a.download = 'photo-' + (i + 1) + '.jpg';
    document.body.appendChild(a);
    setTimeout(() => { a.click(); a.remove(); }, i * 250);
  });
}

document.getElementById('retake').onclick = () => {
  modal.classList.remove('open');
  capture();
};
document.getElementById('close').onclick = () => {
  modal.classList.remove('open');
};
document.getElementById('download').onclick = downloadAll;

window.addEventListener('pagehide', () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
});

startCamera();
</script>
</body>
</html>
